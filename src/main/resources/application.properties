spring.application.name=inventario
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmacia_inventario?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
farmacia-ai.gemini.api-key=${GEMINI_API_KEY:}
farmacia-ai.gemini.model=${GEMINI_MODEL:}
farmacia-ai.gemini.connect-timeout=5s
farmacia-ai.gemini.read-timeout=30s
spring.datasource.password=${DB_PASSWORD:}