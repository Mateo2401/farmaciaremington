<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Proveedor | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link active" th:href="@{/proveedores}">🚚 Proveedores</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Formulario de proveedor</h1>
            <div class="user-chip">
                <span class="user-avatar">P</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>
            <form th:action="${proveedor.idProveedor == null} ? @{/proveedores} : @{/proveedores/{id}(id=${proveedor.idProveedor})}"
                  th:object="${proveedor}" method="post" class="form-grid">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="nombreProveedor">Nombre</label>
                    <input id="nombreProveedor" type="text" th:field="*{nombre}" maxlength="120" required />
                    <small class="muted" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                </div>
                <div class="form-group">
                    <label for="telefonoProveedor">Teléfono</label>
                    <input id="telefonoProveedor" type="text" th:field="*{telefono}" maxlength="20" />
                </div>
                <div class="form-group">
                    <label for="correoProveedor">Correo</label>
                    <input id="correoProveedor" type="email" th:field="*{correo}" maxlength="100" />
                </div>
                <div class="form-group">
                    <label for="direccionProveedor">Dirección</label>
                    <input id="direccionProveedor" type="text" th:field="*{direccion}" maxlength="200" />
                </div>
                <div class="form-group">
                    <label for="estadoProveedor">Estado</label>
                    <select id="estadoProveedor" th:field="*{estado}">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/proveedores}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
