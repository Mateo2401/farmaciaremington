<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Movimientos | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link active" th:href="@{/movimientos-inventario}">📦 Inventario</a>
            <a class="nav-link" th:href="@{/categorias}">📁 Categorías</a>
            <a class="nav-link" th:href="@{/proveedores}">🚚 Proveedores</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">👤 Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Movimientos de inventario</h1>
            <div class="user-chip">
                <span class="user-avatar">I</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div class="actions" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">Historial</h2>
                <a class="btn btn-primary" th:href="@{/movimientos-inventario/nuevo}">Nuevo movimiento</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Usuario</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="movimiento : ${movimientosInventario}">
                        <td th:text="${movimiento.idMovimiento}">1</td>
                        <td>
                            <span class="badge badge-success" th:if="${movimiento.tipo == 'ENTRADA'}" th:text="${movimiento.tipo}">ENTRADA</span>
                            <span class="badge badge-warning" th:unless="${movimiento.tipo == 'ENTRADA'}" th:text="${movimiento.tipo}">SALIDA</span>
                        </td>
                        <td th:text="${movimiento.idProducto}">1</td>
                        <td th:text="${movimiento.cantidad}">1</td>
                        <td th:text="${movimiento.idUsuario}">1</td>
                        <td th:text="${movimiento.fecha != null ? #temporals.format(movimiento.fecha, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                        <td th:text="${movimiento.descripcion ?: '-'}">-</td>
                        <td class="actions">
                            <a class="btn btn-secondary" th:href="@{/movimientos-inventario/{id}/editar(id=${movimiento.idMovimiento})}">Editar</a>
                            <form th:action="@{/movimientos-inventario/{id}/eliminar(id=${movimiento.idMovimiento})}" method="post" style="display:inline;">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                <button class="btn btn-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movimientosInventario)}">
                        <td colspan="8" class="muted">No hay movimientos registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
