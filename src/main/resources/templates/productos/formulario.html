<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Producto | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link active" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link" th:href="@{/movimientos-inventario}">📦 Inventario</a>
            <a class="nav-link" th:href="@{/categorias}">📁 Categorías</a>
            <a class="nav-link" th:href="@{/proveedores}">🚚 Proveedores</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Formulario de producto</h1>
            <div class="user-chip">
                <span class="user-avatar">U</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>
            <form th:action="${producto.idProducto == null} ? @{/productos} : @{/productos/{id}(id=${producto.idProducto})}"
                th:object="${producto}" method="post" class="form-grid">
                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input id="codigo" type="text" th:field="*{codigo}" placeholder="MED001" maxlength="50" required />
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nombre del medicamento" maxlength="150" required />
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <input id="descripcion" type="text" th:field="*{descripcion}" placeholder="Descripción" maxlength="255" />
                </div>
                <div class="form-group">
                    <label for="idCategoria">ID de categoría</label>
                    <input id="idCategoria" type="number" th:field="*{idCategoria}" min="1" required />
                    <small class="muted" th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}"></small>
                </div>
                <div class="form-group">
                    <label for="idProveedor">ID de proveedor (opcional)</label>
                    <input id="idProveedor" type="number" th:field="*{idProveedor}" min="1" />
                </div>
                <div class="form-group">
                    <label for="precioCompra">Precio compra</label>
                    <input id="precioCompra" type="number" step="0.01" min="0" th:field="*{precioCompra}" required />
                    <small class="muted" th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}"></small>
                </div>
                <div class="form-group">
                    <label for="precioVenta">Precio venta</label>
                    <input id="precioVenta" type="number" step="0.01" min="0" th:field="*{precioVenta}" required />
                    <small class="muted" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></small>
                </div>
                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input id="stock" type="number" min="0" th:field="*{stock}" required />
                    <small class="muted" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>
                </div>
                <div class="form-group">
                    <label for="stockMinimo">Stock mínimo</label>
                    <input id="stockMinimo" type="number" min="0" th:field="*{stockMinimo}" required />
                    <small class="muted" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></small>
                </div>
                <div class="form-group">
                    <label for="fechaVencimiento">Fecha vencimiento</label>
                    <input id="fechaVencimiento" type="date" th:field="*{fechaVencimiento}" />
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" th:field="*{estado}">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/productos}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
