<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Productos | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link active" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link" th:href="@{/movimientos-inventario}">📦 Inventario</a>
            <a class="nav-link" th:href="@{/categorias}">📁 Categorías</a>
            <a class="nav-link" th:href="@{/proveedores}">🚚 Proveedores</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">👤 Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Productos</h1>
            <div class="user-chip">
                <span class="user-avatar">U</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div class="actions" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">Inventario farmacéutico</h2>
                <a class="btn btn-primary" th:href="@{/productos/nuevo}">Nuevo producto</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoria</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.codigo}">MED001</td>
                        <td th:text="${producto.nombre}">Acetaminofén 500mg</td>
                        <td th:text="${producto.idCategoria}">1</td>
                        <td th:text="${'$' + #numbers.formatDecimal(producto.precioVenta, 1, 'POINT', 0, 'COMMA')}">$0</td>
                        <td th:text="${producto.stock}">0</td>
                        <td>
                            <span class="badge badge-success" th:if="${producto.estado != null && producto.estado}">Activo</span>
                            <span class="badge badge-warning" th:unless="${producto.estado != null && producto.estado}">Inactivo</span>
                        </td>
                        <td class="actions">
                            <a class="btn btn-secondary" th:href="@{/productos/{id}/editar(id=${producto.idProducto})}">Editar</a>
                            <form th:action="@{/productos/{id}/eliminar(id=${producto.idProducto})}" method="post" style="display:inline;">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                <button class="btn btn-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="7" class="muted">No hay productos registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
