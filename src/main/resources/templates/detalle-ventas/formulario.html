<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Detalle de venta | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link active" th:href="@{/detalle-ventas}">🧾 Detalle ventas</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Detalle de venta</h1>
            <div class="user-chip">
                <span class="user-avatar">D</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <form th:action="@{/detalle-ventas}" th:object="${detalleVenta}" method="post" class="form-grid">
                <div class="form-group">
                    <label for="idVenta">Venta</label>
                    <input id="idVenta" type="number" th:field="*{idVenta}" />
                </div>
                <div class="form-group">
                    <label for="idProductoDetalle">Producto</label>
                    <input id="idProductoDetalle" type="number" th:field="*{idProducto}" />
                </div>
                <div class="form-group">
                    <label for="cantidadDetalle">Cantidad</label>
                    <input id="cantidadDetalle" type="number" th:field="*{cantidad}" />
                </div>
                <div class="form-group">
                    <label for="precioUnitarioDetalle">Precio unitario</label>
                    <input id="precioUnitarioDetalle" type="number" step="0.01" th:field="*{precioUnitario}" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/detalle-ventas}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
