<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Categoría | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link active" th:href="@{/categorias}">📁 Categorías</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Formulario de categoría</h1>
            <div class="user-chip">
                <span class="user-avatar">C</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>
            <form th:action="${categoria.idCategoria == null} ? @{/categorias} : @{/categorias/{id}(id=${categoria.idCategoria})}"
                  th:object="${categoria}" method="post" class="form-grid">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="nombreCategoria">Nombre</label>
                    <input id="nombreCategoria" type="text" th:field="*{nombre}" maxlength="100" required />
                    <small class="muted" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                </div>
                <div class="form-group">
                    <label for="descripcionCategoria">Descripción</label>
                    <textarea id="descripcionCategoria" rows="4" maxlength="255" th:field="*{descripcion}"></textarea>
                    <small class="muted" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/categorias}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
