<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Farmacia - Iniciar sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-brand">
        <div class="brand-mark" style="margin: 0 auto 12px; width: 62px; height: 62px; font-size: 1.5rem;">💊</div>
        <h1>Farmacia</h1>
        <p>Inventario y ventas</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
        Credenciales inválidas. Verifica tu correo y contraseña.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        Has cerrado sesión correctamente.
    </div>

    <form class="login-form" th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Correo electrónico</label>
            <input id="username" name="username" type="email" placeholder="admin@farmacia.com" required />
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
    </form>

    <div class="muted" style="margin-top: 20px; text-align: center; font-size: 0.87rem;">
        Usuarios demo:<br />
        Admin: admin@farmacia.com / admin123<br />
        Vendedor: vendedor@farmacia.com / vendedor123
    </div>
</div>
</body>
</html>
