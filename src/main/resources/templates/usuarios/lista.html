<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Usuarios | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link" th:href="@{/movimientos-inventario}">📦 Inventario</a>
            <a class="nav-link" th:href="@{/categorias}">📁 Categorías</a>
            <a class="nav-link" th:href="@{/proveedores}">🚚 Proveedores</a>
            <a class="nav-link active" sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">👤 Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Usuarios</h1>
            <div class="user-chip">
                <span class="user-avatar">A</span>
                <span th:text="${#authentication.name}">admin</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div class="actions" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">Gestión de usuarios y permisos</h2>
                <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nombre}">Nombre</td>
                        <td th:text="${usuario.correo}">correo@farmacia.com</td>
                        <td>
                            <span class="badge badge-admin" th:if="${usuario.rol == 'ADMINISTRADOR'}">ADMINISTRADOR</span>
                            <span class="badge badge-vendedor" th:unless="${usuario.rol == 'ADMINISTRADOR'}" th:text="${usuario.rol}">VENDEDOR</span>
                        </td>
                        <td>
                            <span class="badge badge-success" th:if="${usuario.estado}">Activo</span>
                            <span class="badge badge-warning" th:unless="${usuario.estado}">Inactivo</span>
                        </td>
                        <td class="actions">
                            <a class="btn btn-secondary" th:href="@{/usuarios/{id}/editar(id=${usuario.idUsuario})}">Editar</a>
                            <form th:action="@{/usuarios/{id}/eliminar(id=${usuario.idUsuario})}" method="post" style="display:inline;">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                <button class="btn btn-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="muted">No hay usuarios registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
