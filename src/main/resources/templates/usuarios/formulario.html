<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Usuario | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link" th:href="@{/movimientos-inventario}">📦 Inventario</a>
            <a class="nav-link" th:href="@{/categorias}">📁 Categorías</a>
            <a class="nav-link active" th:href="@{/usuarios}">👤 Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Formulario de usuario</h1>
            <div class="user-chip">
                <span class="user-avatar">A</span>
                <span th:text="${#authentication.name}">admin</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>
            <form th:action="${usuario.idUsuario == null} ? @{/usuarios} : @{/usuarios/{id}(id=${usuario.idUsuario})}"
                  th:object="${usuario}" method="post" class="form-grid">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" maxlength="100" placeholder="Nombre completo" required />
                    <small class="muted" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                </div>
                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input id="correo" type="email" th:field="*{correo}" maxlength="100" placeholder="correo@farmacia.com" required />
                    <small class="muted" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></small>
                </div>
                <div class="form-group">
                    <label for="contrasena" th:text="${usuario.idUsuario == null ? 'Contraseña' : 'Nueva contraseña (opcional)'}">Contraseña</label>
                    <input id="contrasena" type="password" th:field="*{contrasena}"
                           th:required="${usuario.idUsuario == null}" minlength="8" maxlength="72"
                           placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
                    <small class="muted" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></small>
                </div>
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" th:field="*{rol}" required>
                        <option value="ADMINISTRADOR">Administrador</option>
                        <option value="VENDEDOR">Vendedor</option>
                    </select>
                    <small class="muted" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></small>
                </div>
                <div class="form-group">
                    <label for="estadoUsuario">Estado</label>
                    <select id="estadoUsuario" th:field="*{estado}">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
