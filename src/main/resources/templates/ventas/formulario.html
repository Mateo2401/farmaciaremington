<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Venta | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link active" th:href="@{/ventas}">🧾 Ventas</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Formulario de venta</h1>
            <div class="user-chip">
                <span class="user-avatar">V</span>
                <span th:text="${#authentication.name}">usuario</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>
            <form th:action="${venta.idVenta == null} ? @{/ventas} : @{/ventas/{id}(id=${venta.idVenta})}"
                  th:object="${venta}" method="post" class="form-grid">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="idUsuario">Usuario</label>
                    <input id="idUsuario" type="number" min="1" th:field="*{idUsuario}" required />
                    <small class="muted" th:if="${#fields.hasErrors('idUsuario')}" th:errors="*{idUsuario}"></small>
                </div>
                <div class="form-group">
                    <label for="total">Total</label>
                    <input id="total" type="number" min="0" step="0.01" th:field="*{total}" required />
                    <small class="muted" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></small>
                </div>
                <div class="form-group">
                    <label for="metodoPago">Método de pago</label>
                    <select id="metodoPago" th:field="*{metodoPago}" required>
                        <option value="">Selecciona un método</option>
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TARJETA">Tarjeta</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                    </select>
                    <small class="muted" th:if="${#fields.hasErrors('metodoPago')}" th:errors="*{metodoPago}"></small>
                </div>
                <div class="form-group">
                    <label for="estadoVenta">Estado</label>
                    <select id="estadoVenta" th:field="*{estado}" required>
                        <option value="COMPLETADA">Completada</option>
                        <option value="ANULADA">Anulada</option>
                    </select>
                    <small class="muted" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/ventas}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
