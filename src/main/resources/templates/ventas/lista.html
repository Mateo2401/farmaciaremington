<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Ventas | Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">💊</div>
            <span>FARMACIA</span>
        </div>
        <nav class="nav-menu">
            <a class="nav-link" th:href="@{/dashboard}">🏠 Dashboard</a>
            <a class="nav-link" th:href="@{/productos}">💊 Productos</a>
            <a class="nav-link active" th:href="@{/ventas}">🧾 Ventas</a>
            <a class="nav-link" th:href="@{/movimientos-inventario}">📦 Inventario</a>
            <a class="nav-link" th:href="@{/categorias}">📁 Categorías</a>
            <a class="nav-link" th:href="@{/proveedores}">🚚 Proveedores</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">👤 Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Ventas</h1>
            <div class="user-chip">
                <span class="user-avatar">V</span>
                <span th:text="${#authentication.name}">vendedor</span>
            </div>
        </header>

        <div class="page-card">
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div class="actions" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">Registro de ventas</h2>
                <a class="btn btn-primary" th:href="@{/ventas/nuevo}">Nueva venta</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Factura</th>
                        <th>Usuario</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Pago</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${'VEN-' + venta.idVenta}">VEN-1</td>
                        <td th:text="${venta.idUsuario}">1</td>
                        <td th:text="${venta.fechaVenta != null ? #temporals.format(venta.fechaVenta, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                        <td th:text="${'$' + #numbers.formatDecimal(venta.total, 1, 'POINT', 2, 'COMMA')}">$0.00</td>
                        <td th:text="${venta.metodoPago}">EFECTIVO</td>
                        <td>
                            <span class="badge badge-success" th:if="${venta.estado == 'COMPLETADA'}">Completada</span>
                            <span class="badge badge-warning" th:unless="${venta.estado == 'COMPLETADA'}" th:text="${venta.estado}">Anulada</span>
                        </td>
                        <td class="actions">
                            <a class="btn btn-secondary" th:href="@{/ventas/{id}/editar(id=${venta.idVenta})}">Editar</a>
                            <form th:action="@{/ventas/{id}/eliminar(id=${venta.idVenta})}" method="post" style="display:inline;">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                <button class="btn btn-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="7" class="muted">No hay ventas registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
